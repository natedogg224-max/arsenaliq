name: Update ArsenalIQ Pitcher Database

on:
  workflow_dispatch:

  schedule:
    - cron: "30 6 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  update-pitchers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ArsenalIQ
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Update pitcher database
        working-directory: arsenaliq
        run: |
          python scripts/build_data.py --year 2026 --min-pitches 50

      - name: Verify database exists
        run: |
          test -f arsenaliq/data/pitchers.json
          echo "ArsenalIQ database successfully generated."

      - name: Commit updated database
        run: |
          git config user.name "ArsenalIQ Bot"
          git config user.email "actions@github.com"
          git add arsenaliq/data/pitchers.json

          if git diff --cached --quiet; then
            echo "No pitcher data changes detected."
          else
            git commit -m "Auto-update ArsenalIQ pitcher database"
            git push
          fi
